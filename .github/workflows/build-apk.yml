name: Build APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync web asset
        run: |
          mkdir -p android/app/src/main/assets/www
          cp lumen.html android/app/src/main/assets/www/index.html
          ls -lh android/app/src/main/assets/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.7
        run: |
          cd /tmp
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "/tmp/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk lumen-studio.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lumen-studio-apk
          path: lumen-studio.apk
