plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lumen.studio'
    compileSdk 34

    defaultConfig {
        applicationId "com.lumen.studio"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
